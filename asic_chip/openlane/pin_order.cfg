# -----------------------------------------------------------------------------
# Die pin order for the LingoLOGOS ASIC, OpenLane 1 pin_order.cfg format.
#
# One directive per line: a side name followed by a glob. A pattern covers every bit
# of a bus, and the placer assigns the individual bits along that side in the order
# the netlist enumerates them. Power and ground are not listed here: the pad ring and
# the power distribution network in config.json own them.
#
# This file declares the intended arrangement of the 146 user signals around the
# die, and tests/test_asic_compiler.py checks two things about it: every port of
# lingologos_top is matched by exactly one pattern, and no pattern matches nothing.
# It is a declaration of intent, not a taped-out pad assignment.
# -----------------------------------------------------------------------------

# Left side, 40 bits: the four INT8 input lanes and the GF(2^8) symbol byte.
left in_vector_*
left gf_symbol_in

# Top side, 40 bits: the first two output rows of the mesh accumulator.
top out_vector_0
top out_vector_1

# Right side, 40 bits: the remaining two output rows.
right out_vector_2
right out_vector_3

# Bottom side, 26 signals plus the 14 power pads: control, status and the short
# result buses.
bottom smt_in_bits
bottom gf_next_state
bottom smt_results
bottom clk
bottom rst_n
bottom core_start
bottom core_done
bottom core_pass
bottom core_illegal_seen
