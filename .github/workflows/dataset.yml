name: Dataset Pipeline

# The corpus folder datasets/multilingual is data and tools, independent from the engine in src/.
# This pipeline checks the corpus, learns the tokenizer and the symbolic decoding
# mask from scratch, induces the grammar behind the bracket algebra and publishes
# the packaged files as a GitHub Release. No external hub and no third-party model
# are involved: everything is trained inside this repository.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the packaged dataset and grammar as a GitHub Release"
        type: boolean
        default: true
      release_tag:
        description: "Release tag (leave empty to use dataset-v<run number>)"
        type: string
        default: ""
  push:
    paths:
      - "datasets/multilingual/**"
      - ".github/workflows/dataset.yml"
    tags:
      - "dataset-v*"

permissions:
  contents: read

concurrency:
  group: dataset-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  consistency:
    name: Check corpus consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate the dataset end to end
        run: |
          python datasets/multilingual/tools/validate_dataset.py

      - name: Learn the tokenizer from the corpus
        run: |
          python datasets/multilingual/tools/train_tokenizer.py

      - name: Verify the symbolic decoding mask
        run: |
          python datasets/multilingual/tools/verify_masking.py --samples 200

      - name: Upload the tokenizer and mask artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-artifacts
          path: |
            datasets/multilingual/checkpoints/tokenizer/tokenizer.json
            datasets/multilingual/checkpoints/tokenizer/metrics.json
            datasets/multilingual/checkpoints/masking/masking_metrics.json
          if-no-files-found: error

      - name: Upload the statistics file
        uses: actions/upload-artifact@v4
        with:
          name: dataset-stats
          path: datasets/multilingual/stats.json

  grammar:
    name: Induce the grammar of the bracket algebra
    needs: consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train the probabilistic grammar
        run: |
          python datasets/multilingual/tools/train_grammar.py --epochs 90 --synthetic 900

      - name: Upload grammar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grammar-artifacts
          path: |
            datasets/multilingual/checkpoints/grammar/grammar.json
            datasets/multilingual/checkpoints/grammar/grammar.yaml
            datasets/multilingual/checkpoints/grammar/DatasetGrammar.gf
            datasets/multilingual/checkpoints/grammar/grammar_weights.pt
            datasets/multilingual/checkpoints/grammar/metrics.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release with the dataset file
    needs: [consistency, grammar]
    if: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/dataset-v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Download grammar artifacts
        uses: actions/download-artifact@v4
        with:
          name: grammar-artifacts
          path: staged/grammar

      - name: Download tokenizer artifacts
        uses: actions/download-artifact@v4
        with:
          name: tokenizer-artifacts
          path: staged/tokenizer

      - name: Package the dataset and the trained grammar
        run: |
          mkdir -p dist
          cp datasets/multilingual/stats.json dist/dataset-stats.json
          zip -q -r dist/lingologos-dataset.zip \
            datasets/multilingual/README.md datasets/multilingual/TRAINING.md datasets/multilingual/stats.json \
            datasets/multilingual/data datasets/multilingual/sft datasets/multilingual/corpus datasets/multilingual/configs datasets/multilingual/templates datasets/multilingual/tools
          cp staged/grammar/grammar.json dist/grammar.json
          cp staged/grammar/grammar.yaml dist/grammar.yaml
          cp staged/grammar/DatasetGrammar.gf dist/DatasetGrammar.gf
          cp staged/grammar/metrics.json dist/grammar-metrics.json
          cp staged/tokenizer/tokenizer/tokenizer.json dist/tokenizer.json
          cp staged/tokenizer/tokenizer/metrics.json dist/tokenizer-metrics.json
          cp staged/tokenizer/masking/masking_metrics.json dist/masking-metrics.json
          python - <<'PY'
          import json
          stats = json.load(open("datasets/multilingual/stats.json"))
          print("items: " + str(stats["items_total"]))
          print("logical forms: " + str(stats["logical_forms"]))
          PY
          ls -lh dist

      - name: Create the tag and the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="dataset-v${GITHUB_RUN_NUMBER}"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          ITEMS=$(python -c "import json;print(json.load(open('datasets/multilingual/stats.json'))['items_total'])")
          NOTES="Synthetic multilingual recurrence corpus for LingoLOGOS: ${ITEMS} items in five languages, with the grammar induced from its bracket algebra and the tokenizer plus symbolic decoding mask learned from the corpus itself. Files: lingologos-dataset.zip (full corpus), grammar.json / grammar.yaml / DatasetGrammar.gf (induced grammar), grammar-metrics.json (acceptance gates), tokenizer.json / tokenizer-metrics.json (byte-pair vocabulary), masking-metrics.json (symbolic decoding gates)."
          gh release create "$TAG" dist/*.zip dist/grammar.json dist/grammar.yaml dist/DatasetGrammar.gf dist/grammar-metrics.json dist/tokenizer.json dist/tokenizer-metrics.json dist/masking-metrics.json dist/dataset-stats.json \
            --title "Dataset ${TAG}" \
            --notes "$NOTES" || gh release upload "$TAG" dist/*.zip dist/grammar.json dist/grammar.yaml dist/DatasetGrammar.gf dist/grammar-metrics.json dist/tokenizer.json dist/tokenizer-metrics.json dist/masking-metrics.json dist/dataset-stats.json --clobber
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
