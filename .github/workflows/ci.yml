name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # The workbench tests build real Qt widgets with no display: the offscreen platform
      # paints them in memory, and the native libraries below are what libQt6 needs to load.
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the native libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite with pytest
        run: |
          pytest -v tests/

      - name: Run end-to-end synthesis & formal verification
        run: |
          python src/neuro_symbolic/synthesize.py
